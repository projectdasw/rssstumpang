name: Deploy RSS Stumpang

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222

          script: |
            export GIT_SSH_COMMAND="ssh -i /home/rsss-webserver/.ssh/id_ed25519 -o StrictHostKeyChecking=no"

            cd /var/www/html/rssstumpang

            sudo git reset --hard

            sudo git clean -fd

            sudo git pull origin main

            sudo systemctl restart apache2
