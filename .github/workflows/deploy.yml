name: Deploy RSSS tumpang

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy Website
        run: |
          cd /var/www/html/rssstumpang

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222

          sudo git reset --hard
          sudo git clean -fd
          sudo git pull origin main
          sudo systemctl restart apache2
